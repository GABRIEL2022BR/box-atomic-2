---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: box-atomic-2
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - enable-terra.sh

  - type: dnf
    install:
      packages:
        - vim
        - firefox
        - firefox-langpacks
        - terra-release
        - umbriel-nightly
        - noctalia
    # Não precisa da seção "remove" se você não quer remover nada

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal
      - scope: user

  - type: signing
