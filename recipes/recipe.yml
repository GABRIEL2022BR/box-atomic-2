---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: box-atomic-2
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - enable-terra.sh

  - type: dnf
    install:
      packages:
        - vim
        - firefox
        - firefox-langpacks
        - terra-release
        - umbriel-nightly
        - noctalia
        - polkit-kde
        - kitty
        - nautilus
        - neovim
        - fish
        - xdg-desktop-portal-gtk
        - gvfs
        - gvfs-mtp
        - gvfs-smb
        - file-roller
        - sddm
        - podman 
        - distrobox
        - htop

  - type: systemd
    system:
      enabled:
        - sddm.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.github.tchx84.Flatseal

  - type: signing
